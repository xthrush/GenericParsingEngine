fileType: pdf
description: "Weekly employee PDF report — one record block per employee ID"

recordBoundary:
  type: pattern
  pattern: "EMP-\\d{5}"

fields:
  - name: employeeId
    extractor: regex
    pattern: "(EMP-\\d{5})"
    group: 1

  - name: fullName
    extractor: labelValue
    label: "Name:"
    direction: right

  - name: department
    extractor: labelValue
    label: "Department:"
    direction: right

  - name: startDate
    extractor: regex
    pattern: "Start Date:\\s+(\\d{2}/\\d{2}/\\d{4})"
    group: 1
    type: date
    dateFormat: "MM/dd/yyyy"

  - name: regularHours
    extractor: table
    tableHeader: "Weekly Hours"
    column: "Hours"
    row: "Regular"
    type: decimal
